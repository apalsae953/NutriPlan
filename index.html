<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="La compra, las recetas y las dietas de la semana de tu familia, compartidas y al día en todos los móviles." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="NutriPlan" />
  <title>NutriPlan</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="iconos/icono.svg" type="image/svg+xml" />
  <link rel="icon" href="iconos/icono-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="iconos/icono-180.png" sizes="180x180" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/vistas.css" />

  <!-- Aplicar el tema y el tamaño de letra guardados antes de pintar para evitar parpadeos -->
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('nutriplan_prefs')) || {};
        if (prefs.tema === 'claro' || prefs.tema === 'oscuro') document.documentElement.dataset.tema = prefs.tema;
        if (prefs.letraGrande) document.documentElement.setAttribute('data-letra-grande', '');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <a class="saltar" href="#principal">Saltar al contenido</a>

  <!-- Barra superior: familia activa, sus miembros y título compacto al hacer scroll -->
  <header class="barra" id="barra">
    <div class="barra-interior">
      <div id="chipFamilia"></div>
      <span class="barra-titulo" id="barraTitulo" aria-hidden="true">Plan</span>
      <div class="barra-derecha" id="barraDerecha"></div>
    </div>
  </header>

  <!-- Navegación: abajo en móvil, a la izquierda en escritorio -->
  <nav class="nav" aria-label="Secciones">
    <div class="nav-marca"><i data-ico="hoja"></i>NutriPlan</div>
    <button class="nav-item" data-accion="ir" data-vista="plan" aria-current="page">
      <span class="nav-icono"><i data-ico="plan"></i></span>
      <span>Plan</span>
    </button>
    <button class="nav-item" data-accion="ir" data-vista="recetas">
      <span class="nav-icono"><i data-ico="platos"></i></span>
      <span>Recetas</span>
    </button>
    <button class="nav-item" data-accion="ir" data-vista="compra">
      <span class="nav-icono"><i data-ico="compra"></i></span>
      <span>Compra</span>
      <span class="nav-insignia" id="insigniaCompra" hidden></span>
    </button>
  </nav>

  <main class="principal" id="principal" tabindex="-1">

    <!-- =====================================================
         PLAN: dieta de la semana, con el día de hoy primero
    ===================================================== -->
    <section class="vista" id="vista-plan" aria-labelledby="tituloPlan">
      <header class="cabecera">
        <div>
          <p class="antetitulo" id="planFecha"></p>
          <h1 class="titulo-grande" id="tituloPlan">Plan</h1>
        </div>
      </header>
      <div id="planContenido"></div>
    </section>

    <!-- =====================================================
         RECETAS: el recetario de la familia
    ===================================================== -->
    <section class="vista" id="vista-recetas" aria-labelledby="tituloRecetas" hidden>
      <header class="cabecera">
        <div>
          <p class="antetitulo" id="recetasConteo"></p>
          <h1 class="titulo-grande" id="tituloRecetas">Recetas</h1>
        </div>
      </header>

      <div class="herramientas">
        <label class="buscador">
          <i data-ico="buscar"></i>
          <span class="solo-lectores">Buscar recetas</span>
          <input type="search" id="buscarRecetas" placeholder="Buscar receta o ingrediente" enterkeyhint="search" autocomplete="off" />
        </label>
        <button class="boton-icono boton-borde" id="botonOrdenRecetas" data-accion="ordenRecetas" aria-label="Cambiar orden" title="Cambiar orden">
          <i data-ico="orden"></i>
        </button>
      </div>
      <div class="scroll-x chips-fila" id="filtroTomas"></div>
      <div id="recetasContenido"></div>
    </section>

    <!-- =====================================================
         COMPRA: lista rápida (se vacía) y lista fija (se queda)
    ===================================================== -->
    <section class="vista" id="vista-compra" aria-labelledby="tituloCompra" hidden>
      <header class="cabecera">
        <div>
          <p class="antetitulo" id="compraAntetitulo"></p>
          <h1 class="titulo-grande" id="tituloCompra">Compra</h1>
        </div>
        <button class="boton-icono boton-borde" data-accion="menuCompra" aria-label="Más opciones de la compra">
          <i data-ico="mas_h"></i>
        </button>
      </header>

      <div class="pestanas" role="tablist" aria-label="Listas de la compra">
        <button class="pestana" role="tab" id="pestanaRapida" data-accion="segmentoCompra" data-segmento="rapida" aria-controls="panelRapida" aria-selected="true">
          <i data-ico="rayo"></i>Rápida<span class="pestana-num" id="numRapida"></span>
        </button>
        <button class="pestana" role="tab" id="pestanaFija" data-accion="segmentoCompra" data-segmento="fija" aria-controls="panelFija" aria-selected="false">
          <i data-ico="fija"></i>Fija<span class="pestana-num" id="numFija"></span>
        </button>
      </div>

      <!-- Lista rápida -->
      <div id="panelRapida" role="tabpanel" aria-labelledby="pestanaRapida">
        <form class="anadir-rapido" id="formRapida" autocomplete="off">
          <div class="anadir-rapido-fila">
            <label class="solo-lectores" for="entradaRapida">Añadir a la lista rápida</label>
            <input type="text" id="entradaRapida" name="entrada" placeholder="Añadir: pan, leche…"
                   enterkeyhint="done" autocapitalize="sentences" list="productosConocidos" />
            <button type="button" class="boton-icono anadir-nota" id="botonNotaRapida" aria-expanded="false" aria-controls="notaRapida" aria-label="Añadir instrucciones" title="Añadir instrucciones">
              <i data-ico="nota"></i>
            </button>
            <button type="submit" class="boton-icono boton-primario" aria-label="Añadir">
              <i data-ico="mas"></i>
            </button>
          </div>
          <label class="solo-lectores" for="notaRapida">Instrucciones para quien compre (opcional)</label>
          <input type="text" id="notaRapida" name="nota" class="anadir-rapido-nota" hidden maxlength="200"
                 placeholder="Instrucciones (opcional): marca, tamaño, que esté madura…" enterkeyhint="done" autocapitalize="sentences" />
        </form>
        <datalist id="productosConocidos"></datalist>
        <div class="scroll-x sugerencias" id="sugerenciasRapida"></div>
        <div id="listaRapida"></div>
      </div>

      <!-- Lista fija -->
      <div id="panelFija" role="tabpanel" aria-labelledby="pestanaFija" hidden>
        <p class="panel-intro">Lo que compras siempre. No se borra: márcalo en el súper y desmárcalo todo al volver.</p>
        <div class="herramientas">
          <label class="buscador">
            <i data-ico="buscar"></i>
            <span class="solo-lectores">Buscar en la lista fija</span>
            <input type="search" id="buscarFija" placeholder="Buscar en la lista fija" enterkeyhint="search" autocomplete="off" />
          </label>
        </div>
        <div id="listaFija"></div>
      </div>
    </section>

  </main>

  <!-- Acción principal de la vista -->
  <button class="fab oculto" id="fab" data-accion="fab">
    <i data-ico="mas"></i><span id="fabTexto">Dieta</span>
  </button>

  <!-- Avisos -->
  <div class="avisos" id="avisos" popover="manual" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/iconos.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/categorias.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/nube.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dietas.js"></script>
  <script src="js/recetas.js"></script>
  <script src="js/compra.js"></script>
  <script src="js/familia.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
